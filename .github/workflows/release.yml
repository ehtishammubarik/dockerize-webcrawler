name: Release

# Publishes to PyPI via Trusted Publishing (OIDC). No API token is stored
# anywhere: GitHub proves the workflow's identity to PyPI directly.
#
# The trusted publisher on PyPI must match ALL of these exactly:
#   Owner:              ehtishammubarik
#   Repository:         websieve
#   Workflow filename:  release.yml
#   Environment:        (leave blank)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to release a failing tree
        run: |
          pip install -e ".[dev]"
          pytest
          python .github/scripts/check_no_deps.py

      - name: Verify the tag matches the version in pyproject
        run: |
          # A tag that disagrees with the packaged version produces a release
          # nobody can reproduce from the repo. Fail here instead.
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != pyproject version $ver"; exit 1; }
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
